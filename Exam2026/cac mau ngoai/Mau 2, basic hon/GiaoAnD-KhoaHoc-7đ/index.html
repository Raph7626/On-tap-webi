<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quản lý Khóa học</title>

  <!-- BƯỚC 0: Nạp CDN -->
  <link
    href="../bootstrap-5.0.2-dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- BƯỚC 1: Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-info">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">
        <i class="fa-solid fa-chalkboard-user"></i> Quản lý Khóa học
      </a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navMenu"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link active" href="#">Khóa học</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Học viên</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Giảng viên</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Lịch khai giảng</a></li>
        </ul>
        <!-- BƯỚC 6: Tìm kiếm -->
        <form class="d-flex" id="searchForm">
          <input
            id="searchInput"
            class="form-control me-2"
            type="search"
            placeholder="Tìm theo tên KH hoặc giảng viên..."
          />
          <button class="btn btn-light" type="submit">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
        </form>
      </div>
    </div>
  </nav>

  <!-- BƯỚC 2: Bảng -->
  <div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="mb-0">Danh sách khóa học</h2>
      <button
        type="button"
        class="btn btn-primary"
        id="btnAdd"
        data-bs-toggle="modal"
        data-bs-target="#courseModal"
      >
        <i class="fa-solid fa-plus"></i> Thêm khóa học
      </button>
    </div>

    <div class="table-responsive">
      <table class="table table-bordered table-hover align-middle">
        <thead class="table-info">
          <tr>
            <th style="width:60px">#</th>
            <th>Mã KH</th>
            <th>Tên khóa học</th>
            <th>Giảng viên</th>
            <th class="text-center">Thời lượng (h)</th>
            <th class="text-end">Học phí</th>
            <th>Khai giảng</th>
            <th class="text-center">SĐHV tối đa</th>
            <th class="text-center">Cấp độ</th>
            <th class="text-center">Trạng thái</th>
            <th class="text-center" style="width:140px">Hành động</th>
          </tr>
        </thead>
        <tbody id="courseTbody"></tbody>
      </table>
    </div>

    <div id="emptyState" class="text-center text-muted py-5 d-none">
      <i class="fa-solid fa-book-open fa-3x mb-2"></i>
      <p>Chưa có khóa học nào.</p>
    </div>
  </div>

  <!-- BƯỚC 3: Modal thêm / sửa -->
  <div class="modal fade" id="courseModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <form id="courseForm" novalidate>
          <div class="modal-header bg-info text-white">
            <h5 class="modal-title" id="courseModalLabel">Thêm khóa học</h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
            ></button>
          </div>

          <div class="modal-body">
            <input type="hidden" id="courseId" name="courseId" />

            <div class="row g-3">
              <!-- Tên khóa học -->
              <div class="col-md-8">
                <label for="name" class="form-label">
                  Tên khóa học <span class="text-danger">*</span>
                </label>
                <input
                  type="text"
                  class="form-control"
                  id="name"
                  name="name"
                  placeholder="VD: Lập trình Web Frontend"
                />
              </div>

              <!-- Cấp độ -->
              <div class="col-md-4">
                <label for="level" class="form-label">
                  Cấp độ <span class="text-danger">*</span>
                </label>
                <select class="form-select" id="level" name="level">
                  <option value="">-- Chọn --</option>
                  <option value="Cơ bản">Cơ bản</option>
                  <option value="Trung cấp">Trung cấp</option>
                  <option value="Nâng cao">Nâng cao</option>
                </select>
              </div>

              <!-- Giảng viên -->
              <div class="col-md-6">
                <label for="instructor" class="form-label">
                  Giảng viên <span class="text-danger">*</span>
                </label>
                <input
                  type="text"
                  class="form-control"
                  id="instructor"
                  name="instructor"
                  placeholder="VD: Nguyễn Văn A"
                />
              </div>

              <!-- Thời lượng -->
              <div class="col-md-3">
                <label for="duration" class="form-label">
                  Thời lượng (giờ) <span class="text-danger">*</span>
                </label>
                <input
                  type="number"
                  class="form-control"
                  id="duration"
                  name="duration"
                  min="1"
                  placeholder="VD: 48"
                />
              </div>

              <!-- SĐHV tối đa -->
              <div class="col-md-3">
                <label for="maxStudents" class="form-label">
                  SĐHV tối đa <span class="text-danger">*</span>
                </label>
                <input
                  type="number"
                  class="form-control"
                  id="maxStudents"
                  name="maxStudents"
                  min="1"
                  placeholder="VD: 30"
                />
              </div>

              <!-- Học phí -->
              <div class="col-md-6">
                <label for="fee" class="form-label">
                  Học phí (VNĐ) <span class="text-danger">*</span>
                </label>
                <input
                  type="number"
                  class="form-control"
                  id="fee"
                  name="fee"
                  placeholder="VD: 3500000"
                />
              </div>

              <!-- Ngày khai giảng -->
              <div class="col-md-6">
                <label for="startDate" class="form-label">
                  Ngày khai giảng <span class="text-danger">*</span>
                </label>
                <input
                  type="date"
                  class="form-control"
                  id="startDate"
                  name="startDate"
                />
              </div>

              <!-- Trạng thái -->
              <div class="col-md-6">
                <label for="status" class="form-label">
                  Trạng thái <span class="text-danger">*</span>
                </label>
                <select class="form-select" id="status" name="status">
                  <option value="active">Mở đăng ký</option>
                  <option value="inactive">Đã đóng</option>
                </select>
              </div>
            </div>
          </div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Hủy
            </button>
            <button type="submit" class="btn btn-info text-white">Lưu</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- BƯỚC 5: Modal xóa -->
  <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-danger text-white">
          <h5 class="modal-title">Xác nhận xóa</h5>
          <button
            type="button"
            class="btn-close btn-close-white"
            data-bs-dismiss="modal"
          ></button>
        </div>
        <div class="modal-body">
          Bạn có chắc muốn xóa khóa học
          <strong id="deleteCourseName"></strong>?
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            data-bs-dismiss="modal"
          >
            Hủy
          </button>
          <button type="button" class="btn btn-danger" id="btnConfirmDelete">
            Xóa
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- BƯỚC 0: Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
