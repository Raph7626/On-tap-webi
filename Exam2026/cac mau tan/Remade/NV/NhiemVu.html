<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Công Việc</title>
    <link rel="stylesheet" href="../bootstrap-5.0.2-dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="styleNhiemVu.css">
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-light bg-white shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">Task Manager</a>
            <span class="text-muted small">Chào bạn học viên</span>
        </div>
    </nav>

    <div class="container">

        <!-- Thống kê -->
        <div class="row g-3 mb-4">
            <div class="col-6 col-md-3">
                <div class="card stat-card text-center p-3">
                    <div class="stat-number" id="statTotal">0</div>
                    <div class="stat-label">Tổng số việc</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card stat-card text-center p-3">
                    <div class="stat-number text-secondary" id="statTodo">0</div>
                    <div class="stat-label">Cần làm</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card stat-card text-center p-3">
                    <div class="stat-number text-warning" id="statProgress">0</div>
                    <div class="stat-label">Đang làm</div>
                </div>
            </div>
            <div class="col-6 col-md-3">
                <div class="card stat-card text-center p-3">
                    <div class="stat-number text-success" id="statDone">0</div>
                    <div class="stat-label">Hoàn thành</div>
                </div>
            </div>
        </div>

        <!-- Header + nút thêm -->
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="fw-bold mb-0">Nhiệm vụ của tôi</h4>
            <button class="btn btn-primary" id="btnOpenAdd">+ Thêm việc mới</button>
        </div>

        <!-- Danh sách task -->
        <div id="taskList"></div>

    </div>

    <!-- Modal thêm/sửa -->
    <div class="modal fade" id="taskModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="taskModalTitle">Thêm việc mới</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="taskForm" novalidate>
                        <input type="hidden" id="editIndex" value="-1">

                        <div class="mb-3">
                            <label class="form-label">Nội dung công việc</label>
                            <input type="text" class="form-control" id="taskName" name="taskName"
                                   placeholder="Nhập tên công việc...">
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-6">
                                <label class="form-label">Độ ưu tiên</label>
                                <select class="form-select" id="taskPriority" name="taskPriority">
                                    <option value="">-- Chọn --</option>
                                    <option value="high">High</option>
                                    <option value="medium">Medium</option>
                                    <option value="low">Low</option>
                                </select>
                            </div>
                            <div class="col-6">
                                <label class="form-label">Trạng thái</label>
                                <select class="form-select" id="taskStatus" name="taskStatus">
                                    <option value="">-- Chọn --</option>
                                    <option value="todo">To Do</option>
                                    <option value="inprogress">In Progress</option>
                                    <option value="done">Done</option>
                                </select>
                            </div>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Hủy</button>
                            <button type="submit" class="btn btn-primary" id="btnSubmit">Thêm mới</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal xác nhận xóa -->
    <div class="modal fade" id="deleteModal" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered modal-sm">
            <div class="modal-content text-center p-4">
                <h5 class="fw-bold mb-2">Xác nhận xóa</h5>
                <p class="text-muted small">Bạn muốn xóa "<strong id="deleteName"></strong>"?</p>
                <div class="d-flex justify-content-center gap-2">
                    <button class="btn btn-secondary btn-sm" data-bs-dismiss="modal">Hủy</button>
                    <button class="btn btn-danger btn-sm" id="btnConfirmDelete">Xóa</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../bootstrap-5.0.2-dist/js/jquery-4.0.0.min.js"></script>

    <script src="../bootstrap-5.0.2-dist/js/jquery.validate.min.js"></script>

    <script src="../bootstrap-5.0.2-dist/js/bootstrap.bundle.min.js"></script>

    <script src="data.js"></script>
</body>
</html>
