<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quản lý Nhân viên</title>

  <!-- BƯỚC 0: Nạp CDN -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- BƯỚC 1: Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-success">
    <div class="container-fluid">
      <a class="navbar-brand" href="#">
        <i class="fa-solid fa-id-badge"></i> Quản lý Nhân viên
      </a>
      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navMenu"
      >
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav me-auto">
          <li class="nav-item"><a class="nav-link active" href="#">Nhân viên</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Phòng ban</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Chấm công</a></li>
          <li class="nav-item"><a class="nav-link" href="#">Bảng lương</a></li>
        </ul>
        <!-- BƯỚC 6: Tìm kiếm -->
        <form class="d-flex" id="searchForm">
          <input
            id="searchInput"
            class="form-control me-2"
            type="search"
            placeholder="Tìm theo tên / mã NV / SĐT..."
          />
          <button class="btn btn-light" type="submit">
            <i class="fa-solid fa-magnifying-glass"></i>
          </button>
        </form>
      </div>
    </div>
  </nav>

  <!-- BƯỚC 2: Bảng -->
  <div class="container my-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h2 class="mb-0">Danh sách nhân viên</h2>
      <button
        type="button"
        class="btn btn-primary"
        id="btnAdd"
        data-bs-toggle="modal"
        data-bs-target="#employeeModal"
      >
        <i class="fa-solid fa-plus"></i> Thêm nhân viên
      </button>
    </div>

    <div class="table-responsive">
      <table class="table table-bordered table-hover align-middle">
        <thead class="table-success">
          <tr>
            <th style="width:60px">#</th>
            <th>Mã NV</th>
            <th>Họ tên</th>
            <th>Phòng ban</th>
            <th>Chức vụ</th>
            <th class="text-end">Lương</th>
            <th>Ngày vào làm</th>
            <th>Email</th>
            <th>SĐT</th>
            <th class="text-center">Trạng thái</th>
            <th class="text-center" style="width:140px">Hành động</th>
          </tr>
        </thead>
        <tbody id="employeeTbody"></tbody>
      </table>
    </div>

    <div id="emptyState" class="text-center text-muted py-5 d-none">
      <i class="fa-solid fa-users fa-3x mb-2"></i>
      <p>Chưa có nhân viên nào.</p>
    </div>
  </div>

  <!-- BƯỚC 3: Modal thêm / sửa -->
  <div class="modal fade" id="employeeModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content">
        <form id="employeeForm" novalidate>
          <div class="modal-header bg-success text-white">
            <h5 class="modal-title" id="employeeModalLabel">Thêm nhân viên</h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
            ></button>
          </div>

          <div class="modal-body">
            <input type="hidden" id="employeeId" name="employeeId" />

            <div class="row g-3">
              <!-- Họ tên -->
              <div class="col-md-6">
                <label for="fullName" class="form-label">
                  Họ và tên <span class="text-danger">*</span>
                </label>
                <input
                  type="text"
                  class="form-control"
                  id="fullName"
                  name="fullName"
                  placeholder="VD: Nguyễn Văn A"
                />
              </div>

              <!-- Phòng ban -->
              <div class="col-md-3">
                <label for="department" class="form-label">
                  Phòng ban <span class="text-danger">*</span>
                </label>
                <select class="form-select" id="department" name="department">
                  <option value="">-- Chọn --</option>
                  <option value="Phòng Kỹ thuật">Phòng Kỹ thuật</option>
                  <option value="Phòng Kinh doanh">Phòng Kinh doanh</option>
                  <option value="Phòng Marketing">Phòng Marketing</option>
                  <option value="Phòng Nhân sự">Phòng Nhân sự</option>
                  <option value="Phòng Tài chính">Phòng Tài chính</option>
                </select>
              </div>

              <!-- Chức vụ -->
              <div class="col-md-3">
                <label for="position" class="form-label">
                  Chức vụ <span class="text-danger">*</span>
                </label>
                <input
                  type="text"
                  class="form-control"
                  id="position"
                  name="position"
                  placeholder="VD: Developer"
                />
              </div>

              <!-- Lương -->
              <div class="col-md-4">
                <label for="salary" class="form-label">
                  Lương (VNĐ) <span class="text-danger">*</span>
                </label>
                <input
                  type="number"
                  class="form-control"
                  id="salary"
                  name="salary"
                  placeholder="VD: 20000000"
                />
              </div>

              <!-- Ngày vào làm -->
              <div class="col-md-4">
                <label for="startDate" class="form-label">
                  Ngày vào làm <span class="text-danger">*</span>
                </label>
                <input type="date" class="form-control" id="startDate" name="startDate" />
              </div>

              <!-- Trạng thái -->
              <div class="col-md-4">
                <label for="status" class="form-label">
                  Trạng thái <span class="text-danger">*</span>
                </label>
                <select class="form-select" id="status" name="status">
                  <option value="active">Đang làm</option>
                  <option value="inactive">Nghỉ việc</option>
                </select>
              </div>

              <!-- Email -->
              <div class="col-md-6">
                <label for="email" class="form-label">
                  Email <span class="text-danger">*</span>
                </label>
                <input
                  type="email"
                  class="form-control"
                  id="email"
                  name="email"
                  placeholder="vd: nv@company.vn"
                />
              </div>

              <!-- SĐT -->
              <div class="col-md-6">
                <label for="phone" class="form-label">
                  Số điện thoại <span class="text-danger">*</span>
                </label>
                <input
                  type="text"
                  class="form-control"
                  id="phone"
                  name="phone"
                  placeholder="VD: 0912345678"
                />
              </div>
            </div>
          </div>

          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Hủy
            </button>
            <button type="submit" class="btn btn-success">Lưu</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- BƯỚC 5: Modal xóa -->
  <div class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-danger text-white">
          <h5 class="modal-title">Xác nhận xóa</h5>
          <button
            type="button"
            class="btn-close btn-close-white"
            data-bs-dismiss="modal"
          ></button>
        </div>
        <div class="modal-body">
          Bạn có chắc muốn xóa nhân viên
          <strong id="deleteEmployeeName"></strong>?
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            data-bs-dismiss="modal"
          >
            Hủy
          </button>
          <button type="button" class="btn btn-danger" id="btnConfirmDelete">
            Xóa
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- BƯỚC 0: Scripts -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.19.5/dist/jquery.validate.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
